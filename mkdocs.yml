  - Patterns:
      - "Unit 42: AWS AgentCore Harness - A Vault with a Heap-View: in the DEFAULT configuration an indirect prompt injection (hidden HTML comment: curl <script> | python3) yields ROOT code execution INSIDE the harness process - the built-in shell + file_operations tools ship ENABLED unless allowedTools is scoped, the shell runs as the SAME UID as PID 1 so /proc/1/mem is readable and every AgentCore Identity vault credential the harness resolves sits PLAINTEXT in that heap; Unit 42 exfiltrated the OPERATOR service-account JWT + downstream MCP URL and replayed it from a laptop with NO AWS credentials to read customer PII (the invoking user only holds InvokeHarness - confused deputy); AWS closed HackerOne #3747844 as INFORMATIVE under shared responsibility citing customer-side allowedTools + egress filtering; allowedTools scopes at InvokeHarness time NOT CreateHarness; the shell tool is the new perimeter and vaults protect at rest/in-transit NOT in use; no CVE, no ITW reported (Unit 42, Sep 18 2026)": patterns/unit42-aws-agentcore-harness-shell-identity-vault-heap-exfiltration-september-2026.md
      - "AIR: Plugin4Shell - ZERO-CLICK RCE in ALL FOUR major AI coding agents (Claude Code, Codex, GitHub Copilot, Gemini CLI) via a plugin SHA-PINNING BYPASS: agents check out the pinned plugin commit but NEVER VERIFY THE CHECKOUT LANDED THERE - attacker controlling the plugin repo makes a BRANCH NAMED LIKE THE PINNED 40-HEX SHA the default; git prefers a ref over an object id of the same name so checkout lands on attacker code while the pin looks honored (Gemini CLI variant: a default branch named FETCH_HEAD shadows the fetched commit); background plugin auto-update makes the swap ZERO-CLICK on already-reviewed plugins; the pin resolves inside the agent so NO MARKETPLACE CAN FIX IT (fix: assert git rev-parse HEAD == pinned SHA); Claude Code 2.1.179 + Codex 0.146.0 patched, Copilot NO fix shipped, Google DECLINED and DEPRECATED Gemini CLI (Aug 4); GitHub-only host mitigation does not cover Bitbucket/self-hosted git marketplaces; no ITW reported; scale claims vendor-reported (AIR, Sep 17 2026)": patterns/plugin4shell-agent-plugin-sha-pinning-bypass-air-september-2026.md
      - "Three unrelated Sep 2026 campaigns converge on one pattern: instead of BYPASSING the OS/browser's own tamper-detection, attackers REGENERATE its cryptographic outputs so the platform vouches for the malicious state - KREMLIN recomputes Chrome Secure Preferences HMACs + App-Bound hashes for self-installing extensions, Docro Hijacker sideloads Adblock.dll past the HMAC check, and a Huntress campaign builds PKI on the victim (self-signed root CA posing as Google Trust Services CN=WR3 + forged www.virustotal.com leaf + hosts entry + LocalProxy firewall rule; CA regenerated per host so thumbprint blocklisting is useless). Detection must key on structure/sequence (root-CA install events, Secure Preferences writes from non-browser processes, hosts+firewall-rule pairs, msbuild with stripped imports), never on IOCs of the forged artifact; these artifacts persist past reboot and process kill": patterns/forged-platform-trust-primitives-integrity-regeneration-september-2026.md
      - "Unit 42: post-exploitation workload-identity spoofing in SPIFFE/SPIRE (Sep 10, 2026): an attacker with root on a Kubernetes node manipulates the Linux cgroup (cgroupv2) metadata the SPIRE agent reads during workload attestation (k8s plugin parses /proc/<pid>/mountinfo + /proc/<pid>/cgroups for pod UID / container ID; subset-match against selectors) to impersonate co-located workloads and harvest their SVIDs - identity isolation collapses, lateral movement uses legitimate credentials not stolen secrets; not observed in the wild; Spooffe open-source tool automates the node scan -> mock-cgroup replication -> SPIRE-agent SVID dump to measure the 'root = all node-scoped identities' area of impact; mitigation = node hardening, restrict root/privileged containers, narrow selectors, treat node root as full-identity compromise (Unit 42)": patterns/unit42-spiffe-spire-cgroup-workload-identity-spoofing-spooffe-september-2026.md
